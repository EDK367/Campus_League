spring.application.name=CampusLeague
server.port=${PORT}
server.servlet.context-path=/campus-league/api
spring.web.resources.locations=http://localhost:4200

# base de datos
spring.datasource.url=${DB_URL}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# security
spring.jwt.secret=${KEY}
spring.jwt.expiration=3600000

spring.jpa.open-in-view=false

# maridb
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#hibernate.dialect=org.hibernate.dialect.MariaDB106Dialect

# gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${PASSWORD_APP}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
